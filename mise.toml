[tools]
# Pinned to match CI so a local build can't pass against a different toolchain.
#
# node 24 is what the reusable deploy workflows use (they note anything >=22 keeps
# wrangler-action happy; 24 is the actual default they run).
node = "24"
# python is only used by prune-ingest-logs.yml, but pinning it here means the one
# person who ever debugs that job locally gets the version it actually runs under.
python = "3.12"
