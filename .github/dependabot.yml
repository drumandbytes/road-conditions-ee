version: 2
updates:

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # See cloudflare-workers: wrangler and @cloudflare/workers-types must move
  # together or `npm ci` fails on the peer conflict.
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/api-worker"
      - "/ingest-worker"
      - "/frontend"
    schedule:
      interval: "weekly"
    groups:
      cloudflare:
        patterns:
          - "wrangler"
          - "@cloudflare/*"
      dev-dependencies:
        dependency-type: "development"
        exclude-patterns:
          - "wrangler"
          - "@cloudflare/*"
