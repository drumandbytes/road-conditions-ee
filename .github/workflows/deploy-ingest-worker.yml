name: Deploy ingest-worker

on:
  push:
    branches: [main]
    paths:
      - 'ingest-worker/**'
      - '.github/workflows/deploy-ingest-worker.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    uses: drumandbytes/reusable-actions/.github/workflows/deploy-cloudflare-worker.yml@v1
    with:
      working-directory: ingest-worker
      # node-version inherits the reusable default (24) — see deploy-api-worker.yml.
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
