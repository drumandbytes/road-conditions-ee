name: Deploy api-worker

on:
  push:
    branches: [main]
    paths:
      - 'api-worker/**'
      - '.github/workflows/deploy-api-worker.yml'

jobs:
  deploy:
    uses: drumandbytes/reusable-actions/.github/workflows/deploy-cloudflare-worker.yml@v1
    with:
      working-directory: api-worker
      # wrangler 4.x wants Node >=22; on the default (20) wrangler-action decides the
      # already-`npm ci`'d wrangler is "incompatible" and tries its own `npm i wrangler@4`
      # into the same node_modules, which then conflicts with this project's
      # @cloudflare/workers-types@^5.x (a v4-peer-dependency ERESOLVE, since the reinstalled
      # wrangler wants workers-types@^4.x). Node 22 keeps wrangler-action on the already-locked
      # wrangler, which matches what's actually installed and type-checked locally.
      node-version: "22"
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
