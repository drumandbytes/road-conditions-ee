name: CI

on:
  push:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint

  test-ingest-worker:
    name: Test ingest-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ingest-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  test-api-worker:
    name: Test api-worker
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api-worker
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api-worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
