name: CI

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: drumandbytes/reusable-actions/.github/workflows/node-ci.yml@v1
    with:
      packages: >-
        [
          {"directory": "ingest-worker", "command": "npm run typecheck && npm test"},
          {"directory": "api-worker",    "command": "npm run typecheck && npm test"},
          {"directory": "frontend",      "command": "npm run build"}
        ]
