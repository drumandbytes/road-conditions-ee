name: Bug report
description: Something in Teesilm isn't working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the map
        2. Tap a weather station marker
        3. ...
    validations:
      required: false
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - iOS Safari
        - iOS Chrome/other
        - Android Chrome
        - Android other
        - Desktop browser
        - Other/not sure
    validations:
      required: true
  - type: input
    id: locale
    attributes:
      label: Locale
      description: ET or EN (shown in the app's Info menu)
    validations:
      required: false
