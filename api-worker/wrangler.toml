name = "road-conditions-api-worker"
main = "index.ts"
compatibility_date = "2026-01-01"

# Kept enabled alongside the custom domain below — costs nothing to leave on and gives us a
# fallback host if the custom domain's cert/DNS ever has issues.
workers_dev = true

[observability]
enabled = true
head_sampling_rate = 1

[[d1_databases]]
binding = "DB"
database_name = "road-conditions"
database_id = "b4a456a7-c3f3-4a1e-95e5-4a8b7af4deb1"

# Both free/unauthenticated routes with an external cost if abused: geocode proxies to
# Nominatim, whose usage policy caps at ~1 req/sec for the Worker's whole shared egress IP
# (see geocode.ts); checkout creates a real, live Stripe Checkout Session per call, with no
# cost to the caller otherwise. Keyed by client IP in both handlers.
[[ratelimits]]
name = "GEOCODE_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 10
  period = 10

[[ratelimits]]
name = "CHECKOUT_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 5
  period = 60

# Magic-link sign-in emails (src/routes/login.ts) — requires drumandbytes.ee to be onboarded
# onto Cloudflare Email Sending first (`wrangler email sending enable drumandbytes.ee`), or
# every send just fails at Cloudflare's end with the binding still working fine locally/in CI.
[[send_email]]
name = "EMAIL"

[vars]
# The "roadconditions-admin" Access application's own Application Audience (AUD) tag — not a
# secret, just an identifier scoping JWT verification to this specific application (see
# src/access.ts). Cloudflare Zero Trust → Access → Applications → roadconditions-admin →
# Overview.
ACCESS_AUD = "d69668cfbf997ab5f11f2911217b75853003ce699dc3cba7363d9296f20bd6c4"
# Not secret — needed only to build the R2 SQL HTTP API's URL path. The actual credential is
# R2_SQL_TOKEN, set via `wrangler secret put` (see src/r2sql.ts).
CLOUDFLARE_ACCOUNT_ID = "0ec5fc1b99d7ba6baa1b261591b1b49e"

[[routes]]
pattern = "api.drumandbytes.ee"
custom_domain = true
