name = "road-conditions-ingest-worker"
main = "index.ts"
compatibility_date = "2026-01-01"

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# Two schedules, dispatched in index.ts via controller.cron — split after confirming D1's
# free write-quota was being blown ~5.7x over (weather_stations + hazards need real freshness;
# restrictions/cameras don't change minute to minute, no reason to pay the write cost of
# refreshing them every 3 min too).
crons = ["*/3 * * * *", "*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "road-conditions"
database_id = "b4a456a7-c3f3-4a1e-95e5-4a8b7af4deb1"
