name = "road-conditions-ingest-worker"
main = "index.ts"
compatibility_date = "2026-01-01"
# Required for the `web-push` npm package (Node's `crypto` module) used by src/push.ts —
# verified directly (local + remote `wrangler dev`) that crypto.createECDH and the full
# aes128gcm payload-encryption path work correctly at this compatibility_date, despite an
# open GitHub issue claiming otherwise on older runtime versions.
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[triggers]
# Two schedules, dispatched in index.ts via controller.cron — split after confirming D1's
# free write-quota was being blown ~5.7x over (weather_stations + hazards need real freshness;
# restrictions/cameras don't change minute to minute, no reason to pay the write cost of
# refreshing them every 3 min too).
crons = ["*/3 * * * *", "*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "road-conditions"
database_id = "b4a456a7-c3f3-4a1e-95e5-4a8b7af4deb1"

# Long-term operational log export — see src/log.ts. Feeds the ingest_worker_logs_pipeline ->
# ingest_worker_logs_sink -> R2 Data Catalog Iceberg table (ingest_worker.cycle_logs, in the
# road-conditions-logs bucket). Created via `wrangler pipelines streams/sinks/create`, not
# declarable in this file.
[[pipelines]]
binding = "LOG_STREAM"
stream = "ed2f32a41c584bcf813b41543b21b24f"

[ai]
binding = "AI"

[vars]
# VAPID public key — not secret (it's meant to be public, baked into frontend JS too as
# VITE_VAPID_PUBLIC_KEY), so a plain var rather than `wrangler secret put`. The matching
# private key is a real secret — see VAPID_PRIVATE_KEY, set via `wrangler secret put` (not
# committed here) — push sending is skipped (see notify.ts) until that's in place.
VAPID_PUBLIC_KEY = "BClJsVMQ_wz0DarCqQU6GUEJD-Q4xCc009yNlxWIr_qdLtAoYEmwmUpTueXQPjOEWDdvKhOkcHN_bPOogSL1fBI"
